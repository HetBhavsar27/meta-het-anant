#
# Raspberry Pi 5 RP1 Ethernet support
#

# Core networking
CONFIG_NET=y
CONFIG_INET=y
CONFIG_NETDEVICES=y
CONFIG_ETHERNET=y

# BCM2712 PCIe host controller
CONFIG_PCI=y
CONFIG_PCI_MSI=y
CONFIG_PCIEPORTBUS=y
CONFIG_PCIE_BRCMSTB=y

# RP1 PCIe southbridge
CONFIG_MISC_RP1=y

# RP1 support required by its embedded devices
CONFIG_COMMON_CLK_RP1=y
CONFIG_PINCTRL_RP1=y

# Cadence GEM/MACB Ethernet controller
CONFIG_NET_VENDOR_CADENCE=y
CONFIG_MACB=y

# Ethernet PHY and MDIO framework
CONFIG_MDIO_DEVICE=y
CONFIG_MDIO_BUS=y
CONFIG_OF_MDIO=y
CONFIG_PHYLIB=y
CONFIG_PHYLINK=y
CONFIG_FIXED_PHY=y
CONFIG_BROADCOM_PHY=y
CONFIG_BCM2712_MIP=y
