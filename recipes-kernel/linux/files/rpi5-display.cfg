#
# Raspberry Pi 5 VC4/V3D HDMI display support
#

#
# Direct dependencies required for CONFIG_DRM_VC4=y
#
CONFIG_RASPBERRYPI_FIRMWARE=y
CONFIG_COMMON_CLK=y
CONFIG_PM=y

#
# Audio dependencies required by VC4 HDMI
#
CONFIG_SND=y
CONFIG_SND_PCM=y
CONFIG_SND_PCM_ELD=y
CONFIG_SND_SOC=y
CONFIG_SND_SOC_GENERIC_DMAENGINE_PCM=y
CONFIG_SND_SOC_HDMI_CODEC=y
CONFIG_SOUND=y

#
# Virtual terminal and framebuffer console
#
CONFIG_VT=y
CONFIG_VT_CONSOLE=y
CONFIG_HW_CONSOLE=y
CONFIG_HW_CONSOLE_BINDING=y
CONFIG_FB=y
CONFIG_FRAMEBUFFER_CONSOLE=y
CONFIG_FRAMEBUFFER_CONSOLE_DETECT_PRIMARY=y
CONFIG_FRAMEBUFFER_CONSOLE_DEFERRED_TAKEOVER=y

#
# DRM/KMS core
#
CONFIG_DRM=y
CONFIG_DRM_KMS_HELPER=y
CONFIG_DRM_CLIENT=y
CONFIG_DRM_CLIENT_LIB=y
CONFIG_DRM_CLIENT_SELECTION=y
CONFIG_DRM_CLIENT_SETUP=y
CONFIG_DRM_CLIENT_DEFAULT_FBDEV=y
CONFIG_DRM_FBDEV_EMULATION=y

#
# DRM helpers required by VC4
#
CONFIG_DRM_DISPLAY_HELPER=y
CONFIG_DRM_GEM_DMA_HELPER=y
CONFIG_DRM_GEM_SHMEM_HELPER=y
CONFIG_DRM_EXEC=y
CONFIG_DRM_BRIDGE=y
CONFIG_DRM_PANEL=y
CONFIG_DRM_PANEL_BRIDGE=y
CONFIG_DRM_MIPI_DSI=y

#
# Raspberry Pi display and rendering
#
CONFIG_DRM_VC4=y
CONFIG_DRM_V3D=y

#
# HDMI and CEC
#
CONFIG_HDMI=y
CONFIG_CEC_CORE=y
CONFIG_CEC_NOTIFIER=y
CONFIG_DRM_VC4_HDMI_CEC=y

#
# Contiguous memory used by the display pipeline
#
CONFIG_CMA=y
CONFIG_DMA_CMA=y

#
# BCM2712 IOMMU support
#
CONFIG_IOMMU_SUPPORT=y
CONFIG_IOMMU_API=y
CONFIG_IOMMU_DMA=y
CONFIG_OF_IOMMU=y
CONFIG_ARM_SMMU=y
