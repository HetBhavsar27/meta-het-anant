#
# Raspberry Pi 5 VC4/V3D HDMI display support
#

# Virtual terminal and framebuffer console
CONFIG_VT=y
CONFIG_VT_CONSOLE=y
CONFIG_HW_CONSOLE=y
CONFIG_HW_CONSOLE_BINDING=y
CONFIG_FB=y
CONFIG_FRAMEBUFFER_CONSOLE=y
CONFIG_FRAMEBUFFER_CONSOLE_DETECT_PRIMARY=y
CONFIG_FRAMEBUFFER_CONSOLE_DEFERRED_TAKEOVER=y

# Core DRM/KMS support
CONFIG_DRM=y
CONFIG_DRM_KMS_HELPER=y
CONFIG_DRM_CLIENT=y
CONFIG_DRM_CLIENT_LIB=y
CONFIG_DRM_CLIENT_SELECTION=y
CONFIG_DRM_CLIENT_SETUP=y
CONFIG_DRM_CLIENT_DEFAULT_FBDEV=y
CONFIG_DRM_FBDEV_EMULATION=y

# Generic DRM helpers required by VC4
CONFIG_DRM_DISPLAY_HELPER=y
CONFIG_DRM_GEM_DMA_HELPER=y
CONFIG_DRM_GEM_SHMEM_HELPER=y
CONFIG_DRM_BRIDGE=y
CONFIG_DRM_PANEL=y

# Raspberry Pi display and 3D drivers
CONFIG_DRM_VC4=y
CONFIG_DRM_V3D=y

# HDMI and CEC support
CONFIG_HDMI=y
CONFIG_CEC_CORE=y
CONFIG_CEC_NOTIFIER=y

# Memory allocation used by the display pipeline
CONFIG_CMA=y
CONFIG_DMA_CMA=y

# BCM2712 IOMMU support
CONFIG_IOMMU_SUPPORT=y
CONFIG_IOMMU_API=y
CONFIG_IOMMU_DMA=y
CONFIG_OF_IOMMU=y
CONFIG_ARM_SMMU=y
