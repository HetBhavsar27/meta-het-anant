#
# Raspberry Pi 5 conservative second-stage pruning
#
# Remove only drivers that clearly belong to unrelated graphics hardware
# and kernel test infrastructure.
#
# Preserve VC4, V3D, DRM helpers, panels, bridges, DSI, HDMI, media,
# audio, networking, filesystems and peripheral frameworks.
#

#
# Unrelated GPU drivers
#
# CONFIG_DRM_NOUVEAU is not set
# CONFIG_DRM_ETNAVIV is not set
# CONFIG_DRM_LIMA is not set
# CONFIG_DRM_PANFROST is not set
# CONFIG_DRM_PANTHOR is not set
# CONFIG_DRM_POWERVR is not set

#
# Unrelated SoC display-controller drivers
#
# CONFIG_DRM_KOMEDA is not set
# CONFIG_DRM_MALI_DISPLAY is not set
# CONFIG_DRM_HISI_HIBMC is not set
# CONFIG_DRM_HISI_KIRIN is not set
# CONFIG_DRM_TIDSS is not set
# CONFIG_DRM_HDLCD is not set
# CONFIG_DRM_PL111 is not set

#
# Kernel unit tests and test-only modules
#
# CONFIG_KUNIT is not set
# CONFIG_KUNIT_ALL_TESTS is not set
# CONFIG_DRM_KUNIT_TEST is not set
# CONFIG_DRM_VC4_KUNIT_TEST is not set
# CONFIG_TEST_KMOD is not set
# CONFIG_TEST_FIRMWARE is not set
# CONFIG_TEST_SYSCTL is not set
# CONFIG_TEST_UDELAY is not set
# CONFIG_TEST_STATIC_KEYS is not set
# CONFIG_TEST_DYNAMIC_DEBUG is not set
# CONFIG_TEST_LKM is not set

#
# Build drivers for the selected platform only.
#
# CONFIG_COMPILE_TEST is not set
