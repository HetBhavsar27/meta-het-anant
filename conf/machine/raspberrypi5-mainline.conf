#@TYPE: Machine
#@NAME: Raspberry Pi 5 Mainline Kernel Development Board
#@DESCRIPTION: Raspberry Pi 5 configuration for upstream Linux 7.2.7 \
#              with BCM2712 D0 DTB and dedicated UART debugging.

# Reuse the standard Raspberry Pi 5 machine configuration from
# meta-raspberrypi.
require conf/machine/raspberrypi5.conf


# ---------------------------------------------------------------------------
# Machine identity and compatibility
# ---------------------------------------------------------------------------

# Preserve raspberrypi5 overrides used by meta-raspberrypi recipes while also
# allowing recipes to provide raspberrypi5-mainline-specific overrides.
MACHINEOVERRIDES =. "raspberrypi5-mainline:raspberrypi5:"


# ---------------------------------------------------------------------------
# Kernel selection
# ---------------------------------------------------------------------------

# The kernel bbappend changes the linux-raspberrypi recipe PV to 7.2.7.
PREFERRED_PROVIDER_virtual/kernel = "linux-raspberrypi"
PREFERRED_VERSION_linux-raspberrypi = "7.2.7"


# ---------------------------------------------------------------------------
# Device tree
# ---------------------------------------------------------------------------

# Build and deploy both DTBs while the BCM2712 D0 bring-up is under
# development.
#
# bcm2712-rpi-5-b.dtb:
#   Generic Raspberry Pi 5 Model B device tree.
#
# bcm2712-d-rpi-5-b.dtb:
#   Device tree containing the BCM2712 D0 pinctrl definitions.
RPI_KERNEL_DEVICETREE = " \
    broadcom/bcm2712-rpi-5-b.dtb \
    broadcom/bcm2712-d-rpi-5-b.dtb \
"

KERNEL_DEVICETREE = "${RPI_KERNEL_DEVICETREE}"


# ---------------------------------------------------------------------------
# Firmware boot configuration
# ---------------------------------------------------------------------------

# Explicitly boot the BCM2712 D0-specific DTB.
#
# This is required for the current mainline-kernel experiment because the
# Raspberry Pi firmware bcm2712d0.dtbo overlay does not apply cleanly to the
# upstream Linux 7.2.7 base DTB through standard libfdt overlay resolution.
RPI_EXTRA_CONFIG:append = "\
\ndevice_tree=bcm2712-d-rpi-5-b.dtb\
\nuart_2ndstage=1\
\n"


# ---------------------------------------------------------------------------
# Dedicated Raspberry Pi 5 debug UART
# ---------------------------------------------------------------------------

# Enable the Raspberry Pi UART hardware.
ENABLE_UART = "1"

# ttyAMA10 is the dedicated three-pin Raspberry Pi 5 debug UART.
SERIAL_CONSOLES = "115200;ttyAMA10"

# Normal Linux console after the PL011 driver is initialized.
CMDLINE_SERIAL:pn-rpi-cmdline = "console=ttyAMA10,115200"

# earlycon uses /chosen/stdout-path from the Raspberry Pi 5 device tree.
#
# ignore_loglevel and loglevel=8 expose all kernel messages.
# panic=10 automatically reboots ten seconds after a kernel panic.
CMDLINE_DEBUG:pn-rpi-cmdline = " \
    earlycon \
    ignore_loglevel \
    loglevel=8 \
    panic=10 \
"
